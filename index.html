<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - Standard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN for P2P connection -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .hide { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- CALCULATOR DISGUISE SCREEN (Default Cover) -->
    <div id="calculator-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col justify-end p-6 max-w-md mx-auto">
        <div class="text-right mb-6">
            <div id="calc-history" class="text-slate-500 text-sm h-6"></div>
            <div id="calc-display" class="text-5xl font-bold text-white tracking-wider">0</div>
        </div>
        <div class="grid grid-cols-4 gap-3">
            <button onclick="calcBtn('C')" class="p-4 bg-slate-800 text-rose-400 font-bold rounded-2xl text-xl">C</button>
            <button onclick="calcBtn('del')" class="p-4 bg-slate-800 text-slate-300 font-bold rounded-2xl text-xl"><i class="fa-solid fa-delete-left"></i></button>
            <button onclick="calcBtn('%')" class="p-4 bg-slate-800 text-slate-300 font-bold rounded-2xl text-xl">%</button>
            <button onclick="calcBtn('/')" class="p-4 bg-rose-600/30 text-rose-400 font-bold rounded-2xl text-xl">÷</button>
            
            <button onclick="calcBtn('7')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">7</button>
            <button onclick="calcBtn('8')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">8</button>
            <button onclick="calcBtn('9')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">9</button>
            <button onclick="calcBtn('*')" class="p-4 bg-rose-600/30 text-rose-400 font-bold rounded-2xl text-xl">×</button>
            
            <button onclick="calcBtn('4')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">4</button>
            <button onclick="calcBtn('5')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">5</button>
            <button onclick="calcBtn('6')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">6</button>
            <button onclick="calcBtn('-')" class="p-4 bg-rose-600/30 text-rose-400 font-bold rounded-2xl text-xl">-</button>
            
            <button onclick="calcBtn('1')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">1</button>
            <button onclick="calcBtn('2')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">2</button>
            <button onclick="calcBtn('3')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">3</button>
            <button onclick="calcBtn('+')" class="p-4 bg-rose-600/30 text-rose-400 font-bold rounded-2xl text-xl">+</button>
            
            <button onclick="calcBtn('0')" class="col-span-2 p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl text-left pl-6">0</button>
            <button onclick="calcBtn('.')" class="p-4 bg-slate-900 text-white font-bold rounded-2xl text-xl">.</button>
            <button onclick="calcBtn('=')" class="p-4 bg-rose-600 text-white font-bold rounded-2xl text-xl">=</button>
        </div>
    </div>

    <!-- PASSCODE OVERLAY (Triggers on secret PIN 784908= or long press) -->
    <div id="passcode-screen" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center p-6 hide">
        <div class="w-full max-w-sm bg-slate-900 p-8 rounded-3xl border border-rose-500/20 text-center shadow-2xl">
            <div class="w-16 h-16 bg-rose-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4 text-rose-400 text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-xl font-bold mb-1 text-white">Secret Studio 8.0</h2>
            <p class="text-xs text-slate-400 mb-6">Enter secret passcode to unlock</p>
            <input type="password" id="passcode-input" placeholder="••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-2xl tracking-widest text-white mb-4 focus:outline-none focus:border-rose-500">
            <button onclick="verifyPasscode()" class="w-full py-3 bg-gradient-to-r from-pink-600 to-rose-600 text-white font-bold rounded-xl shadow-lg hover:opacity-90 transition">Unlock Studio</button>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="main-app" class="flex-1 flex flex-col max-w-md mx-auto w-full p-4 hide">
        <!-- Header -->
        <header class="flex justify-between items-center py-3 mb-4 border-b border-slate-800">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-rose-500 rounded-full animate-pulse"></div>
                <h1 class="font-bold text-rose-400 tracking-wide">LoveSync Studio 8.0</h1>
            </div>
            <button onclick="lockApp()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-medium text-slate-300 transition">
                <i class="fa-solid fa-shield-halved mr-1"></i> Lock
            </button>
        </header>

        <!-- Navigation Tabs -->
        <div class="grid grid-cols-4 gap-2 mb-4 bg-slate-900 p-1.5 rounded-2xl border border-slate-800">
            <button onclick="switchTab('vault')" id="tab-btn-vault" class="py-2 rounded-xl text-xs font-semibold text-rose-400 bg-slate-800 transition">Vault</button>
            <button onclick="switchTab('chat')" id="tab-btn-chat" class="py-2 rounded-xl text-xs font-semibold text-slate-400 transition">Chat</button>
            <button onclick="switchTab('call')" id="tab-btn-call" class="py-2 rounded-xl text-xs font-semibold text-slate-400 transition">Call</button>
            <button onclick="switchTab('game')" id="tab-btn-game" class="py-2 rounded-xl text-xs font-semibold text-slate-400 transition">Game</button>
        </div>

        <!-- TAB 1: MOOD VAULT (Photos & Videos) -->
        <div id="tab-vault" class="space-y-4">
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="selectMood('romantic')" class="mood-btn px-4 py-2 bg-rose-600 text-white text-xs rounded-xl font-bold whitespace-nowrap">Romantic</button>
                <button onclick="selectMood('wild')" class="mood-btn px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl font-bold whitespace-nowrap">Wild</button>
                <button onclick="selectMood('secret')" class="mood-btn px-4 py-2 bg-slate-800 text-slate-300 text-xs rounded-xl font-bold whitespace-nowrap">Secret</button>
            </div>
            <div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 text-center">
                <input type="file" id="media-input" accept="image/*,video/*" class="hidden" onchange="handleMediaUpload(event)">
                <button onclick="document.getElementById('media-input').click()" class="w-full py-3 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-bold rounded-xl border border-dashed border-rose-500/30 transition text-sm">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Upload Photo or Video
                </button>
            </div>
            <div id="media-grid" class="grid grid-cols-2 gap-3 pb-6"></div>
        </div>

        <!-- TAB 2: P2P CHAT -->
        <div id="tab-chat" class="flex flex-col flex-1 hide">
            <div id="chat-messages" class="flex-1 bg-slate-900/50 rounded-2xl border border-slate-800 p-3 h-80 overflow-y-auto mb-3 space-y-2 text-sm">
                <div class="text-center text-xs text-slate-500 my-2">Connect P2P below to start secure messaging</div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Type secret message..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-rose-500">
                <button onclick="sendChatMessage()" class="px-5 bg-rose-600 hover:bg-rose-500 text-white rounded-xl font-bold transition"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- TAB 3: P2P VIDEO CALL -->
        <div id="tab-call" class="space-y-4 hide">
            <div class="p-4 bg-slate-900 rounded-2xl border border-slate-800">
                <p class="text-xs text-slate-400 mb-2">Your Peer ID (Share with partner):</p>
                <div class="flex gap-2">
                    <input type="text" id="my-peer-id" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-rose-400 font-mono">
                    <button onclick="copyMyId()" class="px-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs"><i class="fa-solid fa-copy"></i></button>
                </div>
            </div>
            <div class="p-4 bg-slate-900 rounded-2xl border border-slate-800 space-y-3">
                <p class="text-xs text-slate-400">Partner Peer ID:</p>
                <input type="text" id="partner-peer-id" placeholder="Paste partner ID here" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-rose-500">
                <button onclick="startVideoCall()" class="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-xs transition">Start Secure Video Call</button>
            </div>
            <div class="grid grid-cols-2 gap-3 h-48 bg-slate-950 rounded-2xl overflow-hidden border border-slate-800">
                <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
        </div>

        <!-- TAB 4: INTIMATE GAME -->
        <div id="tab-game" class="space-y-4 hide">
            <div class="p-6 bg-slate-900 rounded-2xl border border-rose-500/25 text-center space-y-4">
                <span id="game-category" class="text-xs px-3 py-1 bg-rose-500/20 text-rose-300 rounded-full font-semibold">Lovers Truth or Dare</span>
                <p id="game-question" class="text-base text-slate-200 font-medium min-h-[80px] flex items-center justify-center">Tap a button below to draw your card!</p>
                <div class="flex gap-3 pt-2">
                    <button onclick="drawGameCard('truth')" class="flex-1 py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl transition text-sm">Truth (सच)</button>
                    <button onclick="drawGameCard('dare')" class="flex-1 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl transition text-sm">Dare (डेयर)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        let calcExpr = "";
        function calcBtn(val) {
            const display = document.getElementById("calc-display");
            if (val === 'C') {
                calcExpr = "";
                display.innerText = "0";
            } else if (val === 'del') {
                calcExpr = calcExpr.slice(0, -1);
                display.innerText = calcExpr || "0";
            } else if (val === '=') {
                if (calcExpr === "784908") {
                    showPasscodeScreen();
                    return;
                }
                try {
                    display.innerText = eval(calcExpr);
                    calcExpr = display.innerText;
                } catch {
                    display.innerText = "Error";
                    calcExpr = "";
                }
            } else {
                calcExpr += val;
                display.innerText = calcExpr;
            }
        }

        function showPasscodeScreen() {
            document.getElementById("calculator-screen").classList.add("hide");
            document.getElementById("passcode-screen").classList.remove("hide");
        }

        function verifyPasscode() {
            const pin = document.getElementById("passcode-input").value;
            if (pin === "784908") {
                document.getElementById("passcode-screen").classList.add("hide");
                document.getElementById("main-app").classList.remove("hide");
                initPeer();
                loadMedia('romantic');
            } else {
                alert("Incorrect Passcode!");
            }
        }

        function lockApp() {
            document.getElementById("main-app").classList.add("hide");
            document.getElementById("calculator-screen").classList.remove("hide");
            document.getElementById("passcode-input").value = "";
            calcExpr = "";
            document.getElementById("calc-display").innerText = "0";
        }

        function switchTab(tab) {
            ['vault', 'chat', 'call', 'game'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hide');
                document.getElementById('tab-btn-' + t).classList.remove('bg-slate-800', 'text-rose-400');
                document.getElementById('tab-btn-' + t).classList.add('text-slate-400');
            });
            document.getElementById('tab-' + tab).classList.remove('hide');
            document.getElementById('tab-btn-' + tab).classList.add('bg-slate-800', 'text-rose-400');
            document.getElementById('tab-btn-' + tab).classList.remove('text-slate-400');
        }

        // Vault Logic
        let currentMood = 'romantic';
        let mediaVault = JSON.parse(localStorage.getItem('lovesync_vault') || '{}');

        function selectMood(mood) {
            currentMood = mood;
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.classList.remove('bg-rose-600', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.add('bg-rose-600', 'text-white');
            event.target.classList.remove('bg-slate-800', 'text-slate-300');
            loadMedia(mood);
        }

        function handleMediaUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                if (!mediaVault[currentMood]) mediaVault[currentMood] = [];
                mediaVault[currentMood].push({ type: file.type.startsWith('video') ? 'video' : 'image', data: e.target.result });
                localStorage.setItem('lovesync_vault', JSON.stringify(mediaVault));
                loadMedia(currentMood);
            };
            reader.readAsDataURL(file);
        }

        function loadMedia(mood) {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = '';
            const items = mediaVault[mood] || [];
            if (items.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-xs text-slate-500 py-6">No media uploaded in this mood folder yet.</div>';
                return;
            }
            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'relative aspect-square rounded-xl overflow-hidden bg-slate-950 border border-slate-800';
                if (item.type === 'video') {
                    div.innerHTML = `<video src="${item.data}" controls class="w-full h-full object-cover"></video>`;
                } else {
                    div.innerHTML = `<img src="${item.data}" class="w-full h-full object-cover">`;
                }
                grid.appendChild(div);
            });
        }

        // P2P / PeerJS Logic
        let peer, conn, localStream, currentCall;
        function initPeer() {
            peer = new Peer();
            peer.on('open', id => {
                document.getElementById('my-peer-id').value = id;
            });
            peer.on('connection', c => {
                conn = c;
                setupConnection();
            });
            peer.on('call', call => {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                    localStream = stream;
                    document.getElementById('local-video').srcObject = stream;
                    call.answer(stream);
                    call.on('stream', remoteStream => {
                        document.getElementById('remote-video').srcObject = remoteStream;
                    });
                    currentCall = call;
                });
            });
        }

        function setupConnection() {
            conn.on('data', data => {
                appendMessage(data, 'received');
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            const partnerId = document.getElementById('partner-peer-id').value.trim();
            if (!conn && partnerId) {
                conn = peer.connect(partnerId);
                setupConnection();
            }
            if (conn) {
                conn.send(text);
                appendMessage(text, 'sent');
                input.value = '';
            } else {
                alert("Please connect with partner's Peer ID first!");
            }
        }

        function appendMessage(text, type) {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex ${type === 'sent' ? 'justify-end' : 'justify-start'} mb-1`;
            div.innerHTML = `<div class="max-w-[75%] px-3 py-2 rounded-xl text-xs ${type === 'sent' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-200'}">${text}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function startVideoCall() {
            const partnerId = document.getElementById('partner-peer-id').value.trim();
            if (!partnerId) return alert("Enter partner's Peer ID!");
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                document.getElementById('local-video').srcObject = stream;
                const call = peer.call(partnerId, stream);
                call.on('stream', remoteStream => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
                currentCall = call;
            }).catch(err => alert("Camera/Mic permission required!"));
        }

        // Intimate Game Logic
        const gameDB = {
            truth: [
                "What is your deepest romantic fantasy about us?",
                "Which outfit of mine do you find most irresistible?",
                "What was the exact moment you knew you loved me?",
                "If we were locked in a room together right now, what would you do?"
            ],
            dare: [
                "Send a 10-second voice note whispering how much you desire me.",
                "Turn on your camera and blow a passionate flying kiss.",
                "Describe your absolute favorite physical feature of mine in detail.",
                "Close your eyes for 1 minute and imagine our next night together."
            ]
        };

        function drawGameCard(type) {
            const list = gameDB[type];
            const item = list[Math.floor(Math.random() * list.length)];
            document.getElementById('game-category').innerText = type.toUpperCase() + ' CARD';
            document.getElementById('game-question').innerText = item;
        }
    </script>
</body>
</html>
